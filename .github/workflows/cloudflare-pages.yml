name: Deploy Cloudflare API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/web/functions/**'
      - 'apps/web/src/**'
      - 'apps/web/wrangler.jsonc'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - '.github/workflows/cloudflare-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Build static output (Functions shell)
        run: npm run build
      - name: Verify Cloudflare token (Pages access)
        run: npx wrangler pages project list
      - name: Ensure Cloudflare Pages project exists
        run: |
          npx wrangler pages project create exo-plain-api --production-branch=main 2>/dev/null || true
      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy out --project-name=exo-plain-api --commit-dirty=true
      - name: Publish Gemini secret on Cloudflare Pages
        run: printf '%s' "$GEMINI_API_KEY" | npx wrangler pages secret put GEMINI_API_KEY --project-name=exo-plain-api
